}

function buildTOC() {
  const content = document.querySelector('.art-content');
  if (!content) return;
  const headings = content.querySelectorAll('h2, h3');
  if (headings.length < 2) return; // å°æ¼2åæ¨é¡ä¸é¡¯ç¤ºç®é

  // Add IDs to headings
  headings.forEach((h, i) => {
    if (!h.id) h.id = 'toc-heading-' + i;
  });

  // Build TOC HTML
  let items = '';
  headings.forEach(h => {
    const tag = h.tagName.toLowerCase();
    const cls = tag === 'h2' ? 'toc-h2' : 'toc-h3';
    const text = h.textContent.trim();
    items += '<li><a href="#' + h.id + '" class="' + cls + '">' + text + '</a></li>';
  });

  const toc = document.createElement('nav');
  toc.className = 'toc-box';
  toc.setAttribute('aria-label', 'æç« ç®é');
  toc.innerHTML = '<div class="toc-title">æç« ç®é</div><ul class="toc-list">' + items + '</ul>';

  // Insert TOC before first H2
  const firstH2 = content.querySelector('h2');
  if (firstH2) {
    content.insertBefore(toc, firstH2);
  } else {
    content.insertBefore(toc, content.firstChild);
  }
}

// Auto-call buildTOC via MutationObserver after content loads
(function() {
  const obs = new MutationObserver(function(muts, o) {
    const content = document.querySelector('.art-content');
    if (content && content.querySelector('h2')) {
      buildTOC();
      o.disconnect();
    }
  });
  obs.observe(document.body, {childList:true, subtree:true});
  // Also try after short delay
  setTimeout(function(){if(document.querySelector('.art-content h2') && !document.querySelector('.toc-box')){buildTOC();}}, 800);
  setTimeout(function(){if(document.querySelector('.art-content h2') && !document.querySelector('.toc-box')){buildTOC();}}, 2000);
})();
