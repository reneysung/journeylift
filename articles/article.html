<style>
:root{
  --bg:#faf8f5;--surface:#fff;--border:#e8e0d0;
  --text:#2a2420;--text2:#6b5a4e;--text3:#a89880;
  --accent:#c4956a;--accent2:#8b6a4f;
  --font-serif:'Cormorant Garamond',serif;--font-sans:'Noto Sans TC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:15px;line-height:1.8}
a{color:var(--accent);text-decoration:none}

header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-family:var(--font-serif);font-size:1.5rem;color:var(--accent2)}
.logo span{font-style:italic}
nav{display:flex;gap:2rem}
nav a{font-size:0.78rem;letter-spacing:0.1em;color:var(--text2);transition:color 0.2s}
nav a:hover{color:var(--accent)}

.article-wrap{max-width:720px;margin:0 auto;padding:3rem 2rem 6rem}
/* v2 版型文章（內容帶 .mantu-v2）才加寬；舊文章不受影響 */
.article-wrap:has(.mantu-v2){max-width:1080px}

.art-header{margin-bottom:2.5rem;padding-bottom:2rem;border-bottom:1px solid var(--border)}
.art-emoji{font-size:4rem;line-height:1;margin-bottom:1rem}
.art-meta{font-size:0.72rem;letter-spacing:0.12em;color:var(--text3);margin-bottom:1rem}
.art-meta span{margin-right:1rem}
.art-title{font-family:var(--font-serif);font-size:2.5rem;color:var(--text);line-height:1.3;margin-bottom:1rem}
.art-excerpt{font-size:0.95rem;color:var(--text2);line-height:1.8;font-style:italic}
.art-keywords{display:flex;flex-wrap:wrap;gap:0.4rem;margin-top:1rem}
.kw-tag{background:none;border:1px solid var(--border);padding:0.2rem 0.6rem;font-size:0.68rem;color:var(--text3)}

.art-content{color:var(--text);line-height:2}
.art-content h2{font-family:var(--font-serif);font-size:1.6rem;color:var(--accent2);margin:2rem 0 0.8rem;padding-bottom:0.4rem;border-bottom:1px solid var(--border)}
.art-content h3{font-family:var(--font-serif);font-size:1.2rem;color:var(--text2);margin:1.5rem 0 0.5rem}
.art-content p{margin-bottom:1.2rem}
.art-content img{max-width:100%;margin:1.5rem 0;display:block}
/* v2 內容自帶 max-width 時解除，讓它填滿加寬版面（只作用於 v2） */
.art-content>article.mantu-v2{max-width:100%!important}
.art-content blockquote{border-left:3px solid var(--accent);padding-left:1.2rem;color:var(--text2);margin:1.5rem 0;font-style:italic}
.art-content ul,.art-content ol{padding-left:1.5rem;margin-bottom:1rem}
.art-content li{margin-bottom:0.4rem}
.art-content a{color:var(--accent)}

/* ══════════ v2 版型（.mantu-v2）══════════
   舊文章的 .mantu-lanrenbao 完全不受以下規則影響 */
.article-wrap:has(.mantu-v2) .art-title{font-size:2.9rem;max-width:16em}
.article-wrap:has(.mantu-v2) .art-excerpt{max-width:38em;line-height:2}
.article-wrap:has(.mantu-v2) .art-header{border-bottom:0;padding-bottom:0;margin-bottom:1.5rem}
/* 中文襯線：站台 --font-serif 是 Cormorant（純拉丁），中文會掉到系統宋體（Win/Android 會壞或糊）。
   v2 大量用襯線做店名與大標，所以在 v2 範圍內把 Noto Serif TC 接在後面，並關掉假粗體合成。
   只作用於 v2，舊文章的字體外觀完全不變。 */
.article-wrap:has(.mantu-v2){--font-serif:'Cormorant Garamond','Noto Serif TC',serif}
.mantu-v2{font-synthesis:none}
/* soft／dash 由 accent 推導，換配色只需改 --v2-accent 一個值（前一行為舊瀏覽器 fallback） */
.mantu-v2{--v2-accent:var(--accent);--v2-line:var(--border);
  --v2-t2:var(--text2);--v2-t3:var(--text3);line-height:1.9;
  --v2-soft:var(--surface);--v2-dash:var(--border);
  --v2-soft:color-mix(in srgb,var(--v2-accent) 7%,transparent);
  --v2-dash:color-mix(in srgb,var(--v2-accent) 26%,transparent)}
/* 區段標頭 */
/* 站台導覽列用了裸 header{} 選擇器（第 39 行），內容區若出現 <header> 會被套用 → 這裡解除 */
.mantu-v2 header{background:none;border:0;padding:0;height:auto;position:static;z-index:auto;
  display:block;justify-content:flex-start}
/* 純文字段落（開場／知識段／FAQ／結語）維持易讀寬度，不跟著容器變 1080 */
.mantu-v2 .col{max-width:660px}
.mantu-v2 .col h2{font-family:var(--font-serif);font-size:1.6rem;color:var(--text);
  margin:2.6rem 0 .9rem;padding-bottom:.4rem;border-bottom:1px solid var(--v2-line)}
.mantu-v2 .col h3{font-family:var(--font-serif);font-size:1.1rem;color:var(--v2-t2);margin:1.6rem 0 .4rem}
.mantu-v2 .col p{line-height:2.05}
/* 目錄 */
.mantu-v2 .toc{background:var(--v2-soft);padding:16px 20px;margin:1.8rem 0 0;max-width:660px}
.mantu-v2 .toc strong{display:block;font-size:11px;letter-spacing:.2em;color:var(--v2-accent);margin-bottom:8px}
.mantu-v2 .toc ol{margin:0;padding-left:1.3em;font-size:.9rem}
.mantu-v2 .toc li{margin-bottom:.25rem}
.mantu-v2 .sec-head{display:flex;align-items:baseline;gap:14px;margin:0 0 20px}
.mantu-v2 .sec-head .eyebrow{font-size:11px;letter-spacing:.2em;color:var(--v2-accent);font-weight:700;
  margin:0;white-space:nowrap;border:0;padding:0}
.mantu-v2 .sec-head h2{font-family:var(--font-serif);font-size:1.85rem;margin:0;border:0;padding:0;color:var(--text)}
/* 目錄比較表 */
.mantu-v2 .ix{width:100%;border-collapse:collapse;font-size:.92rem}
.mantu-v2 .ix thead th{text-align:left;font-size:11px;letter-spacing:.14em;color:var(--v2-t3);
  padding:0 14px 10px;border-bottom:1px solid var(--text);font-weight:700}
.mantu-v2 .ix td{padding:16px 14px;border-bottom:1px solid var(--v2-line);vertical-align:top}
.mantu-v2 .ix .c-name{font-weight:700;font-size:.98rem}
.mantu-v2 .ix small{display:block;color:var(--v2-t3);font-size:11px;font-weight:400}
.mantu-v2 .ix tbody tr:hover{background:var(--v2-soft)}
.mantu-v2 .ix-note{font-size:.8rem;color:var(--v2-t3);margin-top:14px;line-height:1.8}
/* 店家區塊 */
.mantu-v2 .studio{margin:4.5rem 0 0;padding-top:2.1rem;border-top:1px solid var(--v2-line)}
.mantu-v2 .studio-head{display:flex;gap:18px;align-items:flex-start;margin-bottom:1.6rem}
.mantu-v2 .numeral{flex:0 0 auto;font-family:var(--font-serif);font-size:13px;font-weight:700;
  color:var(--v2-accent);border:1px solid var(--v2-dash);border-radius:50%;width:34px;height:34px;
  display:grid;place-items:center;margin-top:6px}
.mantu-v2 .studio-name{font-family:var(--font-serif);font-size:2rem;margin:0;line-height:1.35;border:0;padding:0}
.mantu-v2 .studio-line{font-size:.78rem;color:var(--v2-t3);letter-spacing:.06em;margin:6px 0 0}
.mantu-v2 .studio-body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:48px;align-items:start}
.mantu-v2 .studio-main{max-width:660px;min-width:0}
/* 圖組：一律不裁切，只限高 */
.mantu-v2 .studio-gallery{margin:0 0 1.6rem}
.mantu-v2 .fig{margin:0}
.mantu-v2 .fig img{max-width:100%;height:auto;display:block;border-radius:2px;margin:0 auto}
.mantu-v2 .fig figcaption{font-size:.72rem;color:var(--v2-t3);line-height:1.65;margin-top:7px}
.mantu-v2 .fig--lead{margin-bottom:14px}
.mantu-v2 .fig--lead img{max-height:560px;width:auto}
/* auto-fit：只有 2 張時會填滿整列，不會縮成 1/3 留空 */
.mantu-v2 .fig-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;align-items:start}
.mantu-v2 .fig-row .fig img{width:100%}
/* 待補圖框（版型階段用，正式上線前應換成真圖或移除） */
.mantu-v2 .ph .ph-box{aspect-ratio:var(--r,4/3);border:1.5px dashed var(--v2-dash);background:var(--v2-soft);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;text-align:center;padding:10px}
.mantu-v2 .ph-id{font-family:var(--font-serif);font-size:.95rem;color:var(--v2-accent)}
.mantu-v2 .ph-label{font-size:.72rem;color:var(--v2-t2);line-height:1.5}
.mantu-v2 .ph-ratio{font-size:.62rem;color:var(--v2-t3);letter-spacing:.1em}
/* 滿版作品帶 */
.mantu-v2 .band{margin:3.5rem 0 0}
.mantu-v2 .band-cap{font-size:11px;letter-spacing:.16em;color:var(--v2-t3);margin:0 0 12px}
.mantu-v2 .band-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
/* 作品帶是節奏用的裝飾帶，統一裁成 3/2 讓整排齊高；
   主圖組（.studio-gallery）仍絕不裁切。⚠️ 內建文字的圖（before/after）不要放進作品帶。 */
.mantu-v2 .band .fig img{aspect-ratio:3/2;object-fit:cover;width:100%}
/* 小標與內文 */
.mantu-v2 .eyebrow{font-size:11px;letter-spacing:.2em;color:var(--v2-accent);font-weight:700;
  border-bottom:1px solid var(--v2-line);padding-bottom:7px;margin:1.6rem 0 .9rem}
.mantu-v2 .prose p{margin:0;line-height:2.05}
/* 開箱引用 */
.mantu-v2 .pull{margin:0;padding:0 0 0 22px;border-left:2px solid var(--v2-accent);font-style:normal;color:var(--text)}
.mantu-v2 .pull p{font-family:var(--font-serif);font-size:1.03rem;line-height:1.95;margin:0 0 12px}
.mantu-v2 .pull p:before{content:'「'}
.mantu-v2 .pull p:after{content:'」'}
.mantu-v2 .pull cite{display:block;font-style:normal;font-size:.75rem;color:var(--v2-t3);margin-top:14px}
.mantu-v2 .pull cite a{margin-left:8px}
/* 右側資訊卡 */
.mantu-v2 .studio-info{position:sticky;top:28px}
.mantu-v2 .info-card{background:var(--card,#fff);border:1px solid var(--v2-line);padding:22px 20px}
.mantu-v2 .info-title{font-size:11px;letter-spacing:.2em;color:var(--v2-t3);margin:0 0 16px;border:0;padding:0;font-family:var(--font-sans)}
.mantu-v2 .ix-rate{display:flex;align-items:baseline;gap:9px;padding-bottom:15px;margin-bottom:15px;border-bottom:1px solid var(--v2-line)}
.mantu-v2 .ix-rate b{font-family:var(--font-serif);font-size:1.95rem;color:var(--v2-accent);line-height:1}
.mantu-v2 .ix-rate span{font-size:.72rem;color:var(--v2-t3);line-height:1.6}
.mantu-v2 .info-list .row{display:flex;gap:10px;padding:9px 0;border-bottom:1px dashed var(--v2-dash);font-size:.82rem}
.mantu-v2 .info-list .row:last-child{border-bottom:0}
.mantu-v2 .info-list dt{flex:0 0 46px;color:var(--v2-t3);font-size:.72rem;padding-top:1px}
.mantu-v2 .info-list dd{margin:0;line-height:1.75}
.mantu-v2 .info-fit{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--v2-line);font-size:.82rem;line-height:1.7}
.mantu-v2 .info-fit span{display:block;font-size:.65rem;letter-spacing:.18em;color:var(--v2-t3);font-weight:700;margin-bottom:5px}
/* 精簡版店家（只有 1 張圖、無引用） */
.mantu-v2 .studio--brief .studio-body{grid-template-columns:minmax(0,1fr) 300px}
.mantu-v2 .studio--brief .fig-row,.mantu-v2 .studio--brief .band{display:none}
@media(max-width:980px){
  .article-wrap:has(.mantu-v2) .art-title{font-size:2rem}
  .mantu-v2 .studio-body{grid-template-columns:1fr;gap:1.8rem}
  .mantu-v2 .studio-info{position:static}
  .mantu-v2 .studio-name{font-size:1.55rem}
  .mantu-v2 .fig-row,.mantu-v2 .band-grid{grid-template-columns:1fr}
  .mantu-v2 .sec-head{display:block}
  .mantu-v2 .sec-head .eyebrow{display:block;margin-bottom:6px}
  .mantu-v2 .sec-head h2{font-size:1.5rem}
  .mantu-v2 .studio--brief .studio-body{grid-template-columns:1fr}
  .mantu-v2 .ix thead{display:none}
  .mantu-v2 .ix tbody tr{display:block;border-bottom:1px solid var(--v2-line);padding:12px 0}
  .mantu-v2 .ix td{display:block;padding:3px 0;border:0}
}

.video-wrap{margin:2rem 0;aspect-ratio:16/9;background:#000}
.video-wrap iframe{width:100%;height:100%;border:none}

.art-footer{margin-top:3rem;padding-top:2rem;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.related-wrap{margin-top:3rem;padding-top:2rem;border-top:1px solid var(--border)}
.related-title{font-family:var(--font-serif);font-size:1.4rem;color:var(--accent2);margin-bottom:1.2rem}
.related-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}
.related-card{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:8px;overflow:hidden;text-decoration:none;color:inherit;transition:box-shadow .2s,transform .2s;background:var(--card,#fff)}
.related-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.08);transform:translateY(-2px)}
.related-thumb{aspect-ratio:1200/630;background-size:cover;background-position:center;background-color:var(--border)}
.related-info{padding:.7rem .8rem}
.related-meta{font-size:.75rem;color:var(--text2);margin-bottom:.3rem}
.related-name{font-size:.95rem;line-height:1.45;color:var(--text)}
.back-btn{font-size:0.78rem;color:var(--text2);letter-spacing:0.05em}
.back-btn:hover{color:var(--accent)}
.art-date{font-size:0.72rem;color:var(--text3)}

.loading{text-align:center;padding:6rem;color:var(--text3)}
.not-found{text-align:center;padding:6rem}
.not-found h2{font-family:var(--font-serif);font-size:2rem;color:var(--text2);margin-bottom:1rem}

footer{background:var(--surface);border-top:1px solid var(--border);padding:2rem;text-align:center;font-size:0.75rem;color:var(--text3)}

/* ── SHOP INFO CARD ─────────────────────────────────────────────────────── */
.shop-card{background:var(--surface,#1a1714);border:1px solid var(--border,#2a2520);padding:1.8rem;margin:2.5rem 0;font-family:var(--font-sans,'Inter',sans-serif)}
.shop-card-title{font-size:0.65rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--accent,#c9a96e);margin-bottom:1.2rem;display:flex;align-items:center;gap:0.5rem}
.shop-card-title::after{content:'';flex:1;height:1px;background:var(--border,#2a2520)}
.shop-card-name{font-size:1.15rem;font-weight:600;color:var(--text,#e8e0d4);margin-bottom:1rem}
.shop-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:0.6rem 1.5rem;margin-bottom:1.2rem}
@media(max-width:600px){.shop-card-grid{grid-template-columns:1fr}}
.shop-card-row{display:flex;align-items:flex-start;gap:0.5rem;font-size:0.8rem;color:var(--text2,#a09080);line-height:1.5}
.shop-card-row .sci{width:16px;flex-shrink:0;opacity:0.6;margin-top:2px}
.shop-card-row a{color:var(--text2,#a09080);text-decoration:none;border-bottom:1px solid transparent;transition:border-color 0.15s}
.shop-card-row a:hover{border-color:var(--accent,#c9a96e);color:var(--accent,#c9a96e)}
.shop-social{display:flex;gap:0.6rem;flex-wrap:wrap;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border,#2a2520)}
.shop-social a{display:flex;align-items:center;gap:0.4rem;padding:0.4rem 0.9rem;border:1px solid var(--border,#2a2520);font-size:0.72rem;color:var(--text2,#a09080);text-decoration:none;letter-spacing:0.05em;transition:all 0.15s}
.shop-social a:hover{border-color:var(--accent,#c9a96e);color:var(--accent,#c9a96e)}

.share-bar{display:flex;align-items:center;gap:0.8rem;padding:1.5rem 0;border-top:1px solid var(--border,#2a2520);border-bottom:1px solid var(--border,#2a2520);margin:2rem 0}
.share-label{font-size:0.65rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--mist,#8a8278);flex-shrink:0}
.share-btns{display:flex;gap:0.5rem;flex-wrap:wrap}
.contact-line-btn{background:#06C755;color:#fff!important;border:none}
.share-btn{.share-btn{display:inline-flex;align-items:center;gap:0.4rem;padding:0.4rem 1rem;border:1px solid var(--border2,rgba(200,169,110,0.2));background:none;font-size:0.72rem;color:var(--text2,#b8b0a0);cursor:pointer;font-family:inherit;letter-spacing:0.05em;transition:all 0.2s;text-decoration:none}
.share-btn:hover{border-color:var(--accent,#c9a96e);color:var(--accent,#c9a96e)}
.share-btn.copied{border-color:#4caf50;color:#4caf50}

.footer-copyright {
  font-size: 0.82rem;
  color: var(--muted, #8a7f72);
  margin-bottom: 0.6rem;
}
.footer-contact {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.9rem;
  color: #06C755;
  text-decoration: none;
  border: 1.5px solid #06C755;
  padding: 0.4rem 1.2rem;
  border-radius: 20px;
  transition: background 0.2s, color 0.2s;
}
.footer-contact:hover { background: #06C755; color: #fff; }
footer { text-align: center; padding: 2rem 1rem 1.5rem; border-top: 1px solid var(--border, #e8e0d4); margin-top: 2rem; }
</style>

const sb = supabase.createClient(

function copyLink(btn){
  navigator.clipboard.writeText(location.href).then(()=>{
    btn.textContent='✅ 已複製！';
    btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='🔗 複製連結';btn.classList.remove('copied');},2000);
  }).catch(()=>{
    // fallback
    const el=document.createElement('input');
    el.value=location.href;document.body.appendChild(el);
    el.select();document.execCommand('copy');document.body.removeChild(el);
    btn.textContent='✅ 已複製！';btn.classList.add('copied');
    setTimeout(()=>{btn.textContent='🔗 複製連結';btn.classList.remove('copied');},2000);
  });
}
function renderShopCard(info){
    if(!info||!Object.keys(info).some(k=>info[k])) return '';
    const row=(icon,label,val,link)=>val?`<div class="shop-card-row"><span class="sci">${icon}</span><span>${link?`<a href="${link}" target="_blank">${val}</a>`:val}</span></div>`:'';
    const social=[];
    if(info.fb) social.push(`<a href="${info.fb}" target="_blank">📘 Facebook</a>`);
    if(info.ig) social.push(`<a href="${info.ig}" target="_blank">📷 Instagram</a>`);
    if(info.line) social.push(`<a href="${info.line}" target="_blank">💬 LINE</a>`);
    if(info.maps) social.push(`<a href="${info.maps}" target="_blank">🗺️ Google Maps</a>`);
    return `<div class="shop-card">
      <div class="shop-card-title">店家資訊</div>
      ${info.name?'<div class="shop-card-name">'+info.name+'</div>':''}
      <div class="shop-card-grid">
        ${row('📍','地址',info.address,info.maps)}
        ${row('📞','電話',info.phone,info.phone?'tel:'+info.phone.replace(/[^+\d]/g,''):'')}
        ${row('🕐','營業時間',info.hours)}
        ${row('💰','消費',info.price_note)}
        ${row('🅿️','停車',info.parking)}
        ${row('🌐','官網',info.website,info.website)}
      </div>
      ${social.length?'<div class="shop-social">'+social.join('')+'</div>':''}
    </div>`;
  }

async function load(){
  const slug = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop());
  if(!slug){ notFound(); return; }

  // 優先用 worker SSR inline 的資料，跳過 Supabase（避免冷啟動/逾時卡住內文渲染）
  let data = null;
  const ssrEl = document.getElementById('__ssr_article');
  if (ssrEl) { try { data = JSON.parse(ssrEl.textContent); } catch(e){} }
  if (!data) {
    const r = await sb.from('articles')
      .select('*')
      .eq('slug', slug)
      .eq('status','published')
      .single();
    data = r.data;
  }

  if(!data){ notFound(); return; }

  
  // Update OG meta for social sharing
  const setMeta = (sel, val) => {
    const el = document.querySelector(sel);
    if(el && val) el.setAttribute(el.hasAttribute('content')?'content':'href', val);
  };
  const ogImg = data.cover_image || 'https://journeylift.com.tw/og-default.jpg';
  document.title = data.title + ' — 漫途旅遊誌';
  const pageUrl = 'https://journeylift.com.tw/articles/' + slug;
  const seoDesc = (data.excerpt || data.title || '').substring(0, 160);
  const rawKw = Array.isArray(data.keywords) ? data.keywords : (data.keywords ? String(data.keywords).split(',') : []);
  const kwStr = [...new Set([...rawKw, data.city, data.category].filter(Boolean))].join(',');
  // Canonical & meta
  const setId = (id, attr, val) => { const el=document.getElementById(id); if(el&&val) el.setAttribute(attr,val); };
  setId('canonical-url','href', pageUrl);
  setId('meta-desc','content', seoDesc);
  setId('meta-keywords','content', kwStr||'漫途,旅遊,台灣');
  // Schema.org
  const schEl = document.getElementById('schema-jsonld');
  // 只在 SSR 沒填（仍是空 {}）時才由 client 補，避免覆蓋 worker 注入較完整的 Article schema
  if(schEl && schEl.textContent.trim()==='{}') schEl.textContent = JSON.stringify({"@context":"https://schema.org","@type":"BlogPosting","headline":data.title,"description":seoDesc,"url":pageUrl,"datePublished":data.published_at||data.created_at,"author":{"@type":"Organization","name":"漫途旅遊誌"},"keywords":kwStr,"inLanguage":"zh-TW"});
  setMeta('meta[property="og:url"]', pageUrl);
  setMeta('meta[property="og:title"]', data.title);
  setMeta('meta[property="og:description"]', data.excerpt||data.title);
  setMeta('meta[property="og:image"]', ogImg);
  setMeta('meta[name="twitter:title"]', data.title);
  setMeta('meta[name="twitter:description"]', data.excerpt||data.title);
  setMeta('meta[name="twitter:image"]', ogImg);
  setMeta('meta[name="description"]', data.excerpt||data.title);
  // canonical link
  let canonical = document.querySelector('link[rel="canonical"]');
  if(!canonical){ canonical=document.createElement('link'); canonical.rel='canonical'; document.head.appendChild(canonical); }
  canonical.href = pageUrl;
// Update meta (legacy)
  document.title = `${data.title} — 漫途旅遊誌`;
  const desc = document.createElement('meta');
  desc.name='description'; desc.content=data.excerpt||'';
  document.head.appendChild(desc);

  const kws = Array.isArray(data.keywords)?data.keywords:[];
  const embedUrl = data.video_url ? getEmbedUrl(data.video_url) : null;

  document.getElementById('article-wrap').innerHTML = `
    <div class="art-header">
      ${data.cover_image
  ? `<div class="art-cover"><img src="${data.cover_image}" alt="${data.title}" 
      style="width:100%;max-height:420px;object-fit:cover;border-radius:8px;margin-bottom:1.5rem;display:block"
      onerror="this.style.display='none';document.querySelector('.art-emoji-fallback').style.display='block'"></div>
     <div class="art-emoji-fallback" style="display:none">${data.emoji||'✍️'}</div>`
  : `<div class="art-emoji">${data.emoji||'✍️'}</div>`
}
      <div class="art-meta">
        ${data.city?`<span>📍 ${data.city}</span>`:''}
        ${data.category?`<span>${data.category}</span>`:''}
        ${data.published_at?`<span>${new Date(data.published_at).toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric'})}</span>`:''}
      </div>
      <h1 class="art-title">${data.title}</h1>
      ${data.excerpt?`<p class="art-excerpt">${data.excerpt}</p>`:''}
      ${kws.length?`<div class="art-keywords">${kws.map(k=>`<span class="kw-tag">${k}</span>`).join('')}</div>`:''}
    </div>

    ${embedUrl?`<div class="video-wrap"><iframe src="${embedUrl}" allowfullscreen></iframe></div>`:''}

    <div class="art-content">${renderMd(data.content)}</div>

    
${(()=>{
  const url = encodeURIComponent(location.href);
  const title = encodeURIComponent(data.title);
  const fbUrl = 'https://www.facebook.com/sharer/sharer.php?u='+url;
  const lineUrl = 'https://social-plugins.line.me/lineit/share?url='+url;
  const twitterUrl = 'https://twitter.com/intent/tweet?url='+url+'&text='+title;
  return `<div class="share-bar">
    <span class="share-label">分享</span>
    <div class="share-btns">
      <a class="share-btn" href="${fbUrl}" target="_blank" rel="noopener">📘 Facebook</a>
      <a class="share-btn" href="${lineUrl}" target="_blank" rel="noopener">💬 LINE</a>
      <a class="share-btn" href="${twitterUrl}" target="_blank" rel="noopener">𝕏 Twitter</a>
      <button class="share-btn" onclick="copyLink(this)">🔗 複製連結</button>
      <a class="share-btn" href="https://lin.ee/ZBhZQL3" target="_blank" rel="noopener" style="border-color:rgba(0,195,0,0.35);color:#06c755">💬 聯絡我們</a>
    </div>
  </div>`;
})()}
${data.shop_info ? renderShopCard(data.shop_info) : ''}
    ${(()=>{
      try{
        const el=document.getElementById('__ssr_related');
        const rel=el?JSON.parse(el.textContent):[];
        if(!rel.length) return '';
        const card=(r)=>{
          const meta=[r.city?'📍'+r.city:'',r.category||''].filter(Boolean).join(' · ');
          return `<a class="related-card" href="/articles/${r.slug}"><div class="related-thumb"${r.cover_image?` style="background-image:url('${r.cover_image}')"`:''}></div><div class="related-info"><div class="related-meta">${meta}</div><div class="related-name">${r.title||''}</div></div></a>`;
        };
        return `<div class="related-wrap"><h2 class="related-title">相關文章</h2><div class="related-grid">${rel.map(card).join('')}</div></div>`;
      }catch(e){return '';}
    })()}
      <div class="art-footer">
      <a href="/articles" class="back-btn">← 返回文章列表</a>
      <span class="art-date">${data.published_at?'發布於 '+new Date(data.published_at).toLocaleDateString('zh-TW'):''}</span>
    </div>
  `;
}

function notFound(){
  document.getElementById('article-wrap').innerHTML=`
    <div class="not-found">
      <h2>找不到這篇文章</h2>
      <p style="color:var(--text3);margin-bottom:2rem">文章可能已被移除或網址有誤</p>
      <a href="/articles" style="color:var(--accent)">← 返回文章列表</a>
    </div>`;
}

function renderMd(txt){
  if(!txt) return '';
  return txt
    .replace(/<p>####\s+(.+?)<\/p>/g,'<h4>$1</h4>')
    .replace(/<p>###\s+(.+?)<\/p>/g,'<h3>$1</h3>')
    .replace(/<p>##\s+(.+?)<\/p>/g,'<h2>$1</h2>')
    .replace(/<p>#\s+(.+?)<\/p>/g,'<h2>$1</h2>')
    .replace(/^####\s+(.+)$/gm,'<h4>$1</h4>')
    .replace(/^###\s+(.+)$/gm,'<h3>$1</h3>')
    .replace(/^##\s+(.+)$/gm,'<h2>$1</h2>')
    .replace(/^#\s+(.+)$/gm,'<h2>$1</h2>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>');
}
function getEmbedUrl(url){
  let m;
  if((m=url.match(/youtube\.com\/watch\?v=([^&]+)/))) return `https://www.youtube.com/embed/${m[1]}`;
  if((m=url.match(/youtu\.be\/([^?]+)/))) return `https://www.youtube.com/embed/${m[1]}`;
  if((m=url.match(/vimeo\.com\/(\d+)/))) return `https://player.vimeo.com/video/${m[1]}`;
  return null;
}

load();
</script>
