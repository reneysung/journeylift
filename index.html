<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>漫途 — 生活旅遊誌｜用文字記錄每一段旅程</title>
<meta name="description" content="漫途旅遊誌，用文字記錄每一段值得被記住的旅程。">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#faf8f5;--surface:#fff;--border:#e8e0d0;--border2:#d4c8b8;
  --text:#2a2420;--text2:#6b5a4e;--text3:#a89880;
  --accent:#c4956a;--accent2:#8b6a4f;
  --font-serif:'Cormorant Garamond',serif;--font-sans:'Noto Sans TC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:14px}
a{color:inherit;text-decoration:none}

/* HEADER */
header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 2rem;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100}
.logo{font-family:var(--font-serif);font-size:1.6rem;color:var(--accent2)}
.logo em{font-style:italic;color:var(--accent)}
nav{display:flex;gap:2rem;align-items:center}
nav a{font-size:0.78rem;letter-spacing:0.1em;color:var(--text2);transition:color 0.2s}
nav a:hover{color:var(--accent)}
.nav-admin{font-size:0.72rem;color:var(--text3);border:1px solid var(--border2);padding:0.3rem 0.7rem}
.nav-admin:hover{border-color:var(--accent);color:var(--accent)}

/* HERO */
.hero{max-width:1100px;margin:0 auto;padding:5rem 2rem 4rem;display:grid;grid-template-columns:1fr 1fr;gap:4rem;align-items:center}
.hero-text h1{font-family:var(--font-serif);font-size:3.5rem;line-height:1.15;color:var(--text);margin-bottom:1.2rem}
.hero-text h1 em{font-style:italic;color:var(--accent)}
.hero-text p{font-size:0.9rem;color:var(--text2);line-height:1.9;margin-bottom:2rem}
.hero-btns{display:flex;gap:1rem}
.btn-main{background:var(--accent);color:#fff;padding:0.7rem 1.8rem;font-size:0.8rem;letter-spacing:0.1em;font-family:var(--font-sans);border:none;cursor:pointer}
.btn-main:hover{background:var(--accent2)}
.btn-ghost{background:none;color:var(--text2);padding:0.7rem 1.8rem;font-size:0.8rem;letter-spacing:0.1em;font-family:var(--font-sans);border:1px solid var(--border2);cursor:pointer}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.hero-visual{display:flex;align-items:center;justify-content:center}
.hero-emoji-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:0.8rem}
.hero-emoji-item{background:var(--surface);border:1px solid var(--border);padding:1rem;font-size:1.8rem;text-align:center;transition:transform 0.2s}
.hero-emoji-item:hover{transform:translateY(-3px)}

/* SECTION */
.section{max-width:1100px;margin:0 auto;padding:3rem 2rem}
.section-hd{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2rem;padding-bottom:1rem;border-bottom:1px solid var(--border)}
.section-title{font-family:var(--font-serif);font-size:2rem;color:var(--text)}
.section-more{font-size:0.75rem;letter-spacing:0.1em;color:var(--accent);transition:opacity 0.2s}
.section-more:hover{opacity:0.7}

/* ARTICLES GRID */
.arts-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}
.art-card{background:var(--surface);border:1px solid var(--border);transition:transform 0.2s,box-shadow 0.2s;display:block}
.art-card:hover{transform:translateY(-4px);box-shadow:0 12px 32px rgba(0,0,0,0.08)}
.art-emoji{font-size:2.5rem;padding:1.5rem 1.5rem 0.5rem}
.art-body{padding:0 1.5rem 0.8rem}
.art-meta{font-size:0.68rem;letter-spacing:0.1em;color:var(--text3);margin-bottom:0.4rem}
.art-title{font-family:var(--font-serif);font-size:1.25rem;color:var(--text);margin-bottom:0.4rem;line-height:1.4}
.art-excerpt{font-size:0.77rem;color:var(--text2);line-height:1.7;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.art-ft{padding:0.8rem 1.5rem;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.art-date{font-size:0.68rem;color:var(--text3)}
.art-read{font-size:0.72rem;color:var(--accent)}

/* FEATURED - first article bigger */
.arts-grid-featured{display:grid;grid-template-columns:2fr 1fr;gap:1.5rem;margin-bottom:1.5rem}
.art-card-featured .art-emoji{font-size:4rem;padding:2rem 2rem 1rem}
.art-card-featured .art-title{font-size:1.8rem}
.art-card-featured .art-excerpt{-webkit-line-clamp:3}
.arts-grid-side{display:grid;grid-template-rows:1fr 1fr;gap:1.5rem}

/* EMPTY */
.empty{text-align:center;padding:4rem;color:var(--text3)}
.empty-icon{font-size:3rem;margin-bottom:1rem}
.loading{text-align:center;padding:3rem;color:var(--text3);font-size:0.85rem}

/* DIVIDER */
.divider{border:none;border-top:1px solid var(--border);margin:0}

/* FOOTER */
footer{background:var(--surface);border-top:1px solid var(--border);padding:3rem 2rem;margin-top:4rem}
.footer-inner{max-width:1100px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.footer-logo{font-family:var(--font-serif);font-size:1.3rem;color:var(--accent2)}
.footer-logo em{font-style:italic}
.footer-links{display:flex;gap:1.5rem}
.footer-links a{font-size:0.75rem;color:var(--text3)}
.footer-links a:hover{color:var(--accent)}
.footer-copy{font-size:0.72rem;color:var(--text3);margin-top:1.5rem;text-align:center;padding-top:1.5rem;border-top:1px solid var(--border)}

@media(max-width:768px){
  .hero{grid-template-columns:1fr;gap:2rem;padding:3rem 1.5rem}
  .hero-visual{display:none}
  .arts-grid,.arts-grid-featured{grid-template-columns:1fr}
  .arts-grid-side{grid-template-rows:auto}
  .footer-inner{flex-direction:column;gap:1rem;text-align:center}
}
</style>
</head>
<body>

<header>
  <a href="/" class="logo"><em>漫</em>途旅遊誌</a>
  <nav>
    <a href="/">首頁</a>
    <a href="/articles">所有文章</a>
    <a href="/admin" class="nav-admin">後台</a>
  </nav>
</header>

<!-- HERO -->
<section class="hero">
  <div class="hero-text">
    <h1>用文字<br>記錄每一段<br><em>旅途</em></h1>
    <p>漫途是一本關於旅行的誌，<br>記錄那些值得被記住的風景、滋味與感受。</p>
    <div class="hero-btns">
      <a href="/articles" class="btn-main">探索文章</a>
      <a href="/tools/unboxing.html" class="btn-ghost">開箱文工具</a>
    </div>
  </div>
  <div class="hero-visual">
    <div class="hero-emoji-grid">
      <div class="hero-emoji-item">🌸</div>
      <div class="hero-emoji-item">🏔️</div>
      <div class="hero-emoji-item">🌅</div>
      <div class="hero-emoji-item">⛩️</div>
      <div class="hero-emoji-item">🍵</div>
      <div class="hero-emoji-item">✈️</div>
      <div class="hero-emoji-item">🌊</div>
      <div class="hero-emoji-item">📸</div>
    </div>
  </div>
</section>

<hr class="divider">

<!-- LATEST ARTICLES -->
<section class="section">
  <div class="section-hd">
    <h2 class="section-title">最新文章</h2>
    <a href="/articles" class="section-more">查看全部 →</a>
  </div>
  <div id="articles-container">
    <div class="loading">載入中...</div>
  </div>
</section>

<footer>
  <div class="footer-inner">
    <div class="footer-logo"><em>漫</em>途旅遊誌</div>
    <div class="footer-links">
      <a href="/">首頁</a>
      <a href="/articles">文章</a>
      <a href="/tools/unboxing.html">開箱文工具</a>
    </div>
  </div>
  <div class="footer-copy">© 2026 漫途旅遊誌 · 用文字記錄每一段旅程</div>
</footer>

<script>
const sb = supabase.createClient(
  'https://zsebcpfblecwumbaxeaz.supabase.co',
  'sb_publishable_L2DOfeM0cAJqwlVCr1LwtA_jE9MBNDn'
);

async function load(){
  const {data} = await sb.from('articles')
    .select('*')
    .eq('status','published')
    .order('published_at',{ascending:false})
    .limit(6);

  const container = document.getElementById('articles-container');
  const list = data||[];

  if(!list.length){
    container.innerHTML=`<div class="empty"><div class="empty-icon">✍️</div><p>文章即將登場，敬請期待</p></div>`;
    return;
  }

  if(list.length >= 3){
    const [first, second, third, ...rest] = list;
    container.innerHTML = `
      <div class="arts-grid-featured">
        ${artCardFeatured(first)}
        <div class="arts-grid-side">
          ${artCard(second)}
          ${artCard(third)}
        </div>
      </div>
      ${rest.length ? `<div class="arts-grid">${rest.map(artCard).join('')}</div>` : ''}
    `;
  } else {
    container.innerHTML = `<div class="arts-grid">${list.map(artCard).join('')}</div>`;
  }
}

function artCard(a){
  return `<a href="/articles/${a.slug}" class="art-card">
    <div class="art-emoji">${a.emoji||'✍️'}</div>
    <div class="art-body">
      <div class="art-meta">${[a.city,a.category].filter(Boolean).join(' · ')}</div>
      <div class="art-title">${a.title}</div>
      <div class="art-excerpt">${a.excerpt||''}</div>
    </div>
    <div class="art-ft">
      <span class="art-date">${a.published_at?new Date(a.published_at).toLocaleDateString('zh-TW'):''}</span>
      <span class="art-read">閱讀 →</span>
    </div>
  </a>`;
}

function artCardFeatured(a){
  return `<a href="/articles/${a.slug}" class="art-card art-card-featured">
    <div class="art-emoji">${a.emoji||'✍️'}</div>
    <div class="art-body">
      <div class="art-meta">${[a.city,a.category].filter(Boolean).join(' · ')}</div>
      <div class="art-title">${a.title}</div>
      <div class="art-excerpt">${a.excerpt||''}</div>
    </div>
    <div class="art-ft">
      <span class="art-date">${a.published_at?new Date(a.published_at).toLocaleDateString('zh-TW'):''}</span>
      <span class="art-read">閱讀全文 →</span>
    </div>
  </a>`;
}

load();
</script>
</body>
</html>
